spring:
  datasource:
    url: jdbc:postgresql://db:5432/exam_db
    username: postgres
    password: password
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      fail-on-empty-beans: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 监考可配置项（阈值不写死为魔法数字）
exam:
  proctor:
    # 强制交卷的累计切屏阈值（次）
    force-submit-switch-count: 3
    # 新建场次默认迟到宽限量（分钟）
    default-late-entry-minutes: 10
